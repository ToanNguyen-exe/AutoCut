name: Nightly external tests

# F14 §8 — Không xoá test gọi API thật, nhưng cũng không để nó chặn CI.
#
# Test gọi Gemini/Groq cần API key thật và tiêu hạn mức, nên không chạy mỗi
# commit. Thay vì xoá, chuyển sang chạy theo lịch: hết key, đổi model, đổi
# quota → biết trong vòng một ngày, không phải lúc deploy.
#
# Cần secret GEMINI_API_KEY (và GROQ_API_KEY nếu dùng) trong
# Settings → Secrets and variables → Actions. Thiếu secret thì job tự bỏ qua
# thay vì đỏ — vì thiếu secret là chuyện cấu hình, không phải code hỏng.

on:
  schedule:
    # 20:00 UTC = 03:00 giờ Việt Nam (UTC+7), ngoài giờ làm việc.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: Test gọi API thật
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cài Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Bỏ qua nếu chưa cấu hình secret
        id: check
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Không có GEMINI_API_KEY — bỏ qua job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Chạy test external
        if: steps.check.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: gemini
        run: pytest -v -m external
