[pytest]
# =============================================================================
# Cấu hình pytest cho dự án AutoCut.
#
# Vì sao cần: CI chạy `pytest -m "not external"` để bỏ qua các test gọi API
# thật (Gemini, Groq). Nếu marker không được khai báo, pytest sẽ báo lỗi
# "Unknown pytest.mark.external" và job đỏ — dù test đúng.
#
# Quy ước marker:
#   external  — test gọi dịch vụ bên ngoài (cần API key, tốn hạn mức, có thể
#               hỏng do mạng). KHÔNG chạy trong CI thường, chạy ở job
#               nightly-external theo lịch.
#   slow      — test chạy lâu (>10s), ví dụ xử lý video bằng ffmpeg.
# =============================================================================
testpaths = tests
python_files = test_*.py
python_functions = test_*

markers =
    external: gọi API/dịch vụ bên ngoài, cần secret và mạng (bỏ qua trong CI)
    slow: chạy lâu, không phù hợp để chạy mỗi lần commit

# Chỉ hiện cảnh báo một lần cho mỗi loại
filterwarnings =
    default
