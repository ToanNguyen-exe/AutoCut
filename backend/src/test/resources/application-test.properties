# =============================================================================
# Cấu hình profile "test"
#
# Mục đích: chứng minh test KHÔNG BAO GIỜ chạm vào database production.
#
# Cơ chế phòng vệ kép:
#   1. DatabaseConfig có @Profile("!test") -> bean DataSource của production
#      KHÔNG TỒN TẠI khi chạy profile test. Không có gì để trỏ nhầm.
#   2. Tệp này cấp DataSource riêng cho test, trỏ vào H2 in-memory.
#
# Nên: dù backend/.env có DATABASE_URL trỏ Neon thật thì test vẫn không đọc.
# Đây là "xoá đường đi" chứ không phải "chặn đường đi" — khác biệt quan trọng:
# chặn thì còn đường để đi vòng, xoá thì không.
#
# Vì sao H2 chứ không phải Testcontainers: máy dev hiện không có Docker
# (ADR ghi nhận). H2 ở chế độ PostgreSQL đủ để kiểm tra JPA mapping và Flyway
# trên schema rỗng. Khi CI có Docker, đổi sang Testcontainers bằng cách thêm
# một tệp application-ci.properties — không phải sửa test.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:autocut_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Validate để phát hiện lệch giữa entity và schema; Flyway dựng schema từ V1.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test thì Flyway phải chạy THẬT từ V1 trên DB rỗng — đây chính là điều cần
# chứng minh: V1 tự dựng được schema từ số 0, không cần Neon.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Tắt các bean gọi mạng khi chạy test
autocut.r2.enabled=false

# Khoa JWT chi dung cho profile test/CI (AC-9: thieu JWT_SECRET o dev/prod phai chan khoi dong)
autocut.jwt.secret=autocut-test-only-jwt-secret-key-at-least-32-bytes-long
