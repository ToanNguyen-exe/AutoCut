spring.application.name=backend
server.port=8080

# Cấu hình dung lượng upload video lớn
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB

# Định dạng hiển thị JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Cấu hình Hibernate JPA
# ddl-auto=validate: Hibernate CHỈ kiểm tra cấu trúc bảng có khớp entity không,
# KHÔNG tự sửa. Mọi thay đổi schema phải đi qua Flyway (db/migration).
# Trước đây là 'update' — chính nó làm schema Neon trôi khỏi schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — một thẩm quyền duy nhất cho schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: DB đã có sẵn bảng (Neon) chưa từng chạy Flyway.
# Thay vì cố chạy V1 (sẽ lỗi "table already exists"), Flyway đánh dấu V1 là
# đã hoàn tất và chỉ chạy các migration có số lớn hơn.
# Postgres rỗng thì không cần baseline: V1 chạy thật.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline hien trang
# Thà dừng còn hơn tiếp tục với schema lệch
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Cấu hình phân hệ Video (SV1)
autocut.video.ffprobe-path=${FFPROBE_PATH:ffprobe}
autocut.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
autocut.video.timeout-seconds=20
autocut.video.cut-timeout-seconds=300
autocut.video.padding-start=0.3
autocut.video.padding-end=0.5
