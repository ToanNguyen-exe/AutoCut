spring.application.name=backend
server.port=8080

# Cấu hình dung lượng upload video lớn
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB

# Định dạng hiển thị JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# SV1 - VIDEO PROCESSING CONFIGURATION
# ==========================================

autocut.video.ffmpeg-path=ffmpeg
autocut.video.ffprobe-path=ffprobe
autocut.video.timeout-seconds=20
autocut.video.cut-timeout-seconds=300